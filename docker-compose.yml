# Ubuntu Desktop Development Environment
# Access: https://localhost:16901 (VNC) | ssh temple@localhost -p 10022
# Default credentials: temple / temple
# True Docker-in-Docker: Isolated Docker daemon inside container

services:
  desktop:
    build: .
    image: 9cat/ubuntu-desktop:latest
    container_name: temple-desktop
    restart: unless-stopped
    ports:
      - "10022:22"              # SSH access
      - "16901:6901"            # KasmVNC web interface (HTTPS)
      - "51200-51239:51200-51239"  # Docker container ports (for DinD)
    environment:
      - USER=${USER:-temple}
      - PASSWORD=${PASSWORD:-temple}
      - VNC_PASSWORD=${VNC_PASSWORD:-temple}
      - TZ=${TZ:-Asia/Shanghai}
      # SSH_PUBLIC_KEY - Set your SSH public key to override defaults
      # - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
    volumes:
      - desktop-data:/home/temple
      - docker-data:/var/lib/docker    # Persistent Docker data for DinD
      # For Docker-outside-of-Docker (DooD) instead, uncomment below and set privileged: false
      # - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - SYS_PTRACE              # Required for debugging tools
    # True Docker-in-Docker requires privileged mode
    privileged: true
    # Shared memory for Chrome performance
    shm_size: 2gb

volumes:
  desktop-data:
    # Persistent storage for user data
    # Use 'docker compose down -v' to reset
  docker-data:
    # Persistent storage for Docker-in-Docker data
