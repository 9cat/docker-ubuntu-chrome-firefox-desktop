# Ubuntu Desktop Development Environment
# Access: https://localhost:16901 (VNC) | ssh temple@localhost -p 10022
# Default credentials: temple / temple
# Docker-in-Docker: Enabled via socket mounting

services:
  desktop:
    build: .
    image: temple-desktop-dev:latest
    container_name: temple-desktop
    restart: unless-stopped
    ports:
      - "10022:22"              # SSH access
      - "16901:6901"            # KasmVNC web interface (HTTPS)
      # - "51200-51239:51200-51239"  # Optional: additional service ports
    environment:
      - USER=${USER:-temple}
      - PASSWORD=${PASSWORD:-temple}
      - VNC_PASSWORD=${VNC_PASSWORD:-temple}
      - TZ=${TZ:-Asia/Shanghai}
      # SSH_PUBLIC_KEY - Set your SSH public key to override defaults
      # - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
    volumes:
      - desktop-data:/home/temple
      # Docker-in-Docker: Mount host Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    cap_add:
      - SYS_PTRACE              # Required for debugging tools
    # For true Docker-in-Docker (isolated daemon), uncomment:
    # privileged: true
    # Shared memory for Chrome performance
    shm_size: 2gb

volumes:
  desktop-data:
    # Persistent storage for user data
    # Use 'docker compose down -v' to reset
