services:
  desktop:
    build: .
    image: ubuntu-desktop-dev:latest
    container_name: ubuntu-desktop
    restart: unless-stopped
    ports:
      - "10022:22"
      - "13000:3000"
      - "51200-51239:51200-51239"
    environment:
      - USER=${USER:-ubuntu}
      - PASSWORD=${PASSWORD:-ubuntu}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - desktop-data:/config
    cap_add:
      - SYS_PTRACE
    privileged: false

volumes:
  desktop-data:
